<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LeFridge - Connexion</title>
        <link
            rel="stylesheet"
            href="{{ url_for('static', path='/assets/css/styles.css') }}"
        />
    </head>

    <body>
        <header>
            <h1>LeFridge</h1>
        </header>
        <div class="form-container">
            <!-- Action mise à jour vers /token -->
            <form action="/token" method="post">
                <label for="email">Email :</label>
                <input type="email" id="email" name="email" required />

                <label for="password">Mot de passe :</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    required
                />

                <input type="submit" value="Se connecter" />
            </form>
            <p id="error-message" style="color: red; display: none;"></p>
        </div>
    </body>

    <script>
        document.querySelector("form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const form = e.target;
            const data = Object.fromEntries(new FormData(form).entries());
            const errorMessageDiv = document.getElementById("error-message");

            errorMessageDiv.style.display = "none";

            try {
                const res = await fetch("/token", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data),
                });

                if (!res.ok) {
                    const errorData = await res.json();
                    errorMessageDiv.textContent = errorData.detail || "Erreur de connexion";
                    errorMessageDiv.style.display = "block";
                } else {
                    // window.location.href = "/";
                }
            } catch (err) {
                console.error("Erreur serveur :", err);
                errorMessageDiv.textContent = "Impossible de contacter le serveur.";
                errorMessageDiv.style.display = "block";
            }
        });
    </script>
</html>
