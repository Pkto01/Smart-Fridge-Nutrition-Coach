<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LeFridge - User</title>
        <link
            rel="stylesheet"
            href="{{ url_for('static', path='/assets/css/styles.css') }}"
        />
    </head>
    <header>
        <nav class="navbar"">
            <ul class="nav-list">
            {% for elem in meals %}
            <li><a href="/user/{{id}}/{{elem}}">{{elem}}</a></li>
            {% endfor %}
            </ul>
        </nav>
    </header>
    <body>
        Je suis l'utilisateur avec l'id {{ id }}
        <div class="form-container">
            <form action="/api/user_stats/" method="post">
                <label for="fname">Prénom :</label>
                <input type="text" id="fname" name="FirstName" required />

                <label for="lname">Nom de Famille :</label>
                <input type="text" id="lname" name="LastName" required />

                <label for="username">Nom d'utilisateur :</label>
                <input type="text" id="username" name="Username" required />

                <label for="email">Email :</label>
                <input type="email" id="email" name="Email" required />

                <label for="password">Mot de passe :</label>
                <input
                    type="password"
                    id="password"
                    name="Password"
                    minlength="8"
                    required
                />

                <label for="sexe">Sexe :</label>
                <select name="Sexe" id="sexe" required>
                    {% for nom, membre in sexe.__members__.items() %}
                    <option value="{{ membre.value }}">{{ membre.value }}</option>
                    {% endfor %}
                </select>

                <label for="weight">Poids (en kg) :</label>
                <input
                    type="number"
                    id="weight"
                    name="Poids"
                    step="0.1"
                    required
                />

                <label for="height">Taille (en cm) :</label>
                <input type="number" id="height" name="Taille" required />

                <label for="age">Âge :</label>
                <input type="number" id="age" name="Age" required />

                <label for="activity_level">Niveau d'activité :</label>
                <select name="activity_level" id="ActivityLevel" required>
                    {% for nom, membre in activity.__members__.items() %}
                    <option value="{{ membre.value }}">{{ membre.value }}</option>
                    {% endfor %}
                </select>

                <label for="goal">But :</label>
                <select name="Goal" id="goal" required>
                    {% for nom, membre in goal.__members__.items() %}
                    <option value="{{ membre.value }}">{{ membre.value }}</option>
                    {% endfor %}
                </select>

                <input type="submit" value="Submit" />
                <input type="reset" value="Reset" />
            </form>
        </div>
    </body>
    <script>
        document.querySelector("form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const form = e.target;
            const data = Object.fromEntries(new FormData(form).entries());

            // conversions de types + renommage du champ mal nommé
            data.Poids = parseFloat(data.Poids);
            data.Taille = parseInt(data.Taille);
            data.Age = parseInt(data.Age);
            data.ActivityLevel = data.activity_level;
            delete data.activity_level;

            const res = await fetch("/api/user_stats/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data),
            });
        });
    </script>
</html>
